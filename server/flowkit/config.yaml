ipv6:
  enabled: true
  interface_name: Ethernet
  ips: []
  method: subnet
  pool_url: http://192.168.88.146:8765
  prefix_length: 56
  socks_port: 1080
  subnet_prefix: ''
quota:
  cooldown_seconds: 120
  retry_count: 3
  retry_delay: 15
rate_limit:
  cooldown_per_instance: 5
  max_concurrent_per_instance: 1
recovery:
  chrome_restart_delay: 5
  extension_reconnect_timeout: 30
  level1_max_attempts: 2
  level2_max_attempts: 2
  level3_max_attempts: 3
  min_recovery_interval: 30
rotation:
  cooldown_seconds: 300
  max_consecutive_403: 3
  max_retries_per_request: 3
timeouts:
  health_check: 5
  image_generation: 120
  task_watchdog: 960
  video_poll: 900
  video_poll_interval: 10
  video_submit: 60
