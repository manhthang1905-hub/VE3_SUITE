# FlowKit Multi-Instance Config
# 1 server = 1 Chrome = 1 account = 1 FlowKit agent (independent)
#
# Port scheme:
#   API: 8100 + index (FlowKit HTTP server)
#   WS:  9222 + index (Extension WebSocket)
#
# Each instance gets:
#   - Its own extension copy (flowkit_extensions/ext_810N)
#   - Its own database (flowkit_data/instance_N/flow_agent.db)
#   - Its own Chrome with unique user-data-dir

