# ║            STYLE TEMPLATE — Copy this for new channels              ║
# ║              Topic: success (phat trien ban than / self-development)           ║
# ║                                                                      ║
# ║  📖 READ THE FULL GUIDE: _TEMPLATE/README.md                        ║
# ║     Contains field-by-field guide, examples, pipeline flow,          ║
# ║     and validation checklist.                                        ║
# ║                                                                      ║
# ║  Quick Steps:                                                        ║
# ║  1. Create folder: reference_characters/success/MT1-T{N}/            ║
# ║  2. Add nv1.png (character reference image) to the folder            ║
# ║  3. Copy this file as style.yaml, fill ALL CHANGE_ME fields          ║
# ║  4. Run: python validate_channel.py MT1-T{N}                        ║
# ║  5. Done! No Python code changes needed.                             ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ─── VISUAL IDENTITY ───────────────────────────────────────────────────
# These fields define the channel's unique art style.
# TIP: Look at nv1.png carefully and describe EXACTLY what you see.

# Unique name for this style (snake_case, descriptive)
style_name: "CHANGE_ME_example_warm_sketch"

# MOST IMPORTANT FIELD — Full image style description matching nv1.png.
# Include: body shape, head shape, eye style, clothing details, colors,
# line style, background texture, mood. End with standard negatives.
image_style: "CHANGE_ME — describe the exact visual style of nv1.png here, including body proportions, clothing colors and details, line weight, background texture, mood. End with: no real humans, no photorealism, no 3D, no readable text, no watermark"

# Video animation style — derived from image_style
video_style: "Same CHANGE_ME style, gentle slow motion, [clothing details] preserved, [background] grain, simple props and soft silhouettes in matching style"

# YouTube thumbnail style
thumbnail_style: "CHANGE_ME self-development YouTube thumbnail, [key character feature], [background], one grounded symbolic growth prop, warm clickable composition"

# Scene planning language
scene_plan_style: "CHANGE_ME self-development illustration language, [character description], [background], grounded symbolic props, motivational body posture, warm readable before/after cause-and-effect"

# Color palette (comma-separated key colors from nv1.png)
palette: "CHANGE_ME — list 5-7 key colors from nv1.png, e.g.: warm terracotta, khaki tan, cream paper, charcoal outline, soft gray shadow"

# What to NEVER include
negative_prompt: "no real humans, no photorealism, no 3D, no flat sterile digital look, no heavy texture, no neon colors, no readable text, no watermark"


# ─── CHARACTER LOCKING ─────────────────────────────────────────────────
# These fields ensure the AI always generates the SAME character.

# Reference lock — strict instruction to match nv1.png
reference_lock: "Use nv1.png as the exact identity and style anchor: CHANGE_ME describe body, head, eyes, clothing, colors. Keep this exact character consistent, no redesign."

# Technical suffix — consistency rules
technical_suffix: "same exact CHANGE_ME channel style for all figures, props, rooms, and elements, consistent nv1 reference when used, no readable text, no watermark"

# Engagement rules — composition guidelines
engagement_rules: "center the CHANGE_ME character as the motivational anchor, use simple grounded props showing habits, goals or progress, let body language speak, keep the self-development idea instantly relatable"

# Default character prompt — standalone description for generation
default_character_prompt: "CHANGE_ME — full standalone character description matching nv1.png, with background and style"

# Short character lock — compact version for inline use
default_character_lock: "CHANGE_ME — compact character description, e.g.: short round white-headed character with terracotta sweater, khaki pants, white sneakers"


# ─── AUDIENCE & CULTURE ────────────────────────────────────────────────
# These fields control localization. This is what makes each channel unique.

# Language name (English word). This is AUTO-DETECTED — no code change needed.
audience_language: "CHANGE_ME — e.g.: Hindi, Arabic, Thai, Polish"

# Cultural context note — describe the target audience and their visual world.
# Include: age range, daily life settings, cultural concepts, seasonal anchors.
# This is the single most important field for localization quality.
audience_culture_note: "CHANGE_ME — Design for [language] self-development viewers aged 18-40. Use settings that evoke [country] daily life: [list 5-8 specific environments]. Emphasize local growth concepts: [list 3-5 local terms for discipline, perseverance, drive]. Props should include [list 5-8 everyday objects]. Prefer [motivational style] over [what to avoid]. [Unique cultural insight about visual storytelling]."


# ─── CULTURAL VISUAL VOCABULARY ────────────────────────────────────────
# These fields give the AI CONCRETE cultural objects and metaphors to use.
# Without these, the AI defaults to generic Western imagery.

# Comma-separated list of 8-12 culturally specific props/objects.
# These REPLACE generic objects (coffee mug → yunomi tea cup, etc.)
cultural_props: "CHANGE_ME — e.g.: yunomi tea cup, habit notebook, small potted plant, neatly placed shoes in the genkan, wall calendar, water bottle, simple alarm clock, low wooden desk"

# Pipe-separated concept:visual mappings. Include the 10 core self-development concepts.
# Format: concept: detailed visual scene description with nv1
cultural_metaphors: "CHANGE_ME — procrastination: [task-avoidance visual with nv1] | discipline: [steady consistent-action visual] | small_steps: [incremental progress visual] | goal: [clear target visual] | comfort_zone: [stepping out of safety visual] | focus: [removing distraction visual] | growth: [visible personal development visual] | confidence: [self-belief / standing tall visual] | resilience: [getting back up after failure visual] | time_management: [organizing the day visual]"

# How motivation and effort should be expressed visually for this culture.
# Describe the audience's relationship with effort, progress, struggle, growth.
cultural_emotion_style: "CHANGE_ME — [Culture] audiences value [motivational expression style]. Show self-development through [what works]. Express [cultural growth concept] through [visual method]. Effort is shown through [specific approach]. Prefer [cultural preference] over [what to avoid]."
