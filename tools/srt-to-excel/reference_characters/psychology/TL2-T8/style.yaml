audience_language: 'Korean'
audience_culture_note: 'Design for Korean psychology and self-care viewers aged 18-35. Use settings from modern Korean daily life: small one-room studios (wonsil) with warm LED desk lamps, convenience store aisles at night, Han River park benches at dusk, subway seats, rooftop views of apartment complexes, cozy cafe corners with iced Americano, PC bang glow. Emphasize concepts of nunchi (reading the room and emotional awareness), jeong (deep unspoken emotional bonds), han (accumulated sorrow channeled into resilience), and self-care as self-respect. The simple hand-drawn pencil sketch style reflects Korean illustrated diary (geurim-ilgi) culture — a personal intimate aesthetic that resonates with Korean audiences'' appreciation for healing through quiet creative expression and lo-fi warmth. Props should include iced coffee cups, earbuds, phone screens (blank, no text), hoodie hoods pulled up for comfort, small potted succulents, convenience store ramyeon. Korean audiences respond to understated emotional honesty — show vulnerability through small gestures like looking down, pulling sleeves over hands, sitting alone but at peace. Avoid over-dramatic poses; prefer quiet, relatable ''healing'' (힐링) moments.'
cultural_props: 'iced Americano cup with straw, wireless earbuds on table, phone face-down (blank screen), convenience store ramyeon cup, hoodie hood pulled up, small potted succulent on desk, LED desk lamp warm glow, subway handrail, rooftop railing overlooking apartments, photo booth strip'
cultural_metaphors: 'anxiety: subway crowd silhouettes pressing inward while nv1 puts on earbuds to create bubble | stress: too many notification shapes floating around nv1 at a small desk under LED lamp | boundary: nv1 pulls hoodie hood up creating a soft personal cocoon in a crowded space | connection: two iced Americano cups side by side on a Han River park bench | letting_go: nv1 deletes a notification shape by swiping it away from the phone screen | loneliness: nv1 sits alone eating ramyeon at a convenience store window counter at night | growth: a small succulent on nv1 desk growing one new leaf under warm LED light | courage: nv1 removes earbuds and turns to face a silhouette with open posture | acceptance: nv1 sits on rooftop watching city lights and breathes out visible calm | forgiveness: nv1 places phone face-down on table and looks up with soft expression'
cultural_emotion_style: 'Korean audiences connect through understated emotional honesty and healing (힐링) culture. Show psychology through modern urban relatable moments: late-night convenience store runs, solo cafe time, rooftop reflections, subway commutes. Vulnerability is shown through small gestures — pulling sleeves over hands, looking down, eating alone but finding peace in it. Korean emotional expression values the space between words (nunchi). Show jeong (deep unspoken bonds) through side-by-side presence, not dramatic declarations. The aesthetic is lo-fi calm meets urban melancholy.'
