audience_language: "Italian"
audience_culture_note: "Design for Italian psychology and personal growth viewers aged 25-45. Use settings rooted in Italian daily beauty: small kitchen tables with espresso moka pot steaming, apartment balconies overlooking terracotta rooftops, piazza benches under plane trees, trattoria corners with bread and olive oil, morning light through shuttered windows, evening passeggiata on cobblestone streets, garden terraces with lemon trees. Emphasize concepts of la bella figura (presenting your best self while being genuine), famiglia (family as emotional foundation), dolce far niente (the sweetness of doing nothing as self-care), and pazienza (patience as strength). The warm camel-tan sweater and cream pants echo Italian ''maglia morbida'' (soft knit) tradition — earth tones inspired by Renaissance palettes and Mediterranean warmth that feel like inherited family clothing, resonating with Italian viewers who value timeless style over trends. Props should include espresso cups, bread baskets, ceramic plates, linen curtains blowing, old stone walls, wooden shutters, potted basil. Italian audiences value emotional authenticity expressed through warmth, not clinical detachment — show psychology through human connection scenes: a quiet moment sharing coffee, sitting alone watching sunset over rooftops, walking slowly through a garden. The warm parchment texture echoes centuries of Italian visual culture from fresco to sketchbook."

cultural_props: "moka pot steaming on stove, espresso cup on saucer, bread loaf on wooden cutting board, lemon hanging on tree branch, ceramic plate with olive oil, wooden window shutter half-open, terracotta flower pot on step, linen curtain blowing in breeze, old stone wall with ivy"
cultural_metaphors: "anxiety: cracked terracotta pot slowly leaking water while nv1 steadies it with both hands | stress: too many plates spinning on nv1 arms in a warm rustic kitchen | boundary: nv1 gently closes one wooden shutter leaving the other open for light | connection: two espresso cups and a shared bread basket on a small kitchen table | letting_go: nv1 watches a lemon fall from the tree and roll gently across cobblestones | loneliness: nv1 sits alone at a trattoria table for one watching the piazza empty at dusk | growth: a basil plant in a terracotta pot pushing through kitchen windowsill into morning sun | courage: nv1 opens both wooden shutters wide letting golden light flood the room | acceptance: nv1 holds a chipped ceramic cup tenderly instead of discarding it | forgiveness: nv1 pours olive oil from one vessel to another as a gesture of sharing"
cultural_emotion_style: "Italian audiences find psychology through warmth, beauty, and human connection rather than clinical analysis. Show emotions through sensory everyday moments: the ritual of making espresso, breaking bread, opening shutters to morning light. Express la bella figura (presenting your best while being genuine) through composed but warm posture. Vulnerability is shown through tender interactions with objects — holding a chipped cup, steadying a leaning plant. Dolce far niente (sweetness of doing nothing) is valid self-care. Prefer golden-hour Mediterranean light and rustic textures that feel like inherited wisdom."

