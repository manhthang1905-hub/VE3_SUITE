cultural_metaphors: 'anxiety: dark cloud shadow creeping across sunlit plaza while nv1 shelters under stone arch | stress: too many ceramic plates stacked on nv1 arms in a warm family kitchen | boundary: nv1 closes wooden courtyard gate with iron latch while silhouettes wait outside | connection: two ceramic coffee cups steaming on small plaza table with bread basket between them | letting_go: nv1 opens hands and paper dove floats upward over terracotta rooftops at sunset | loneliness: nv1 sits alone on stone plaza bench at dusk while families pass in the background | growth: geranium pushing through cracked terracotta balcony pot into golden morning light | courage: nv1 pushes open heavy old wooden door with iron ring and steps into warm courtyard light | acceptance: nv1 sits at sobremesa table with empty plates and holds warm cup peacefully | forgiveness: nv1 places an extra coffee cup on the plaza table for someone approaching'
cultural_emotion_style: 'Spanish audiences express emotions through warm social connection and calor humano (human warmth). Show psychology through vivid relatable moments: animated hand gestures during cafe conversations, shared meals at family tables, solitary walks through golden-hour plazas, balcony reflections at sunset. Vulnerability is expressed openly within trusted circles — a hand on a friend''s arm, tears without shame, leaning on a family member''s shoulder. Sobremesa (the art of lingering after a meal) represents emotional processing and connection. The Mediterranean aesthetic values warmth over coolness: golden light, stone textures, terracotta, wrought iron. Silence is uncomfortable; healing comes through conversation, community, and shared rituals.'
