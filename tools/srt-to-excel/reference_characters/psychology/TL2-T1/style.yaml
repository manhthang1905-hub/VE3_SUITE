audience_language: 'Spanish'
audience_culture_note: 'Design for Spanish psychology and personal growth viewers aged 20-40. Use settings rooted in Spanish daily life: sunlit plazas with stone benches under orange trees, apartment balconies with geranium pots and wrought-iron railings, small bar counters with cafe con leche, family kitchen tables with bread and olive oil, narrow cobblestone callejones at golden hour, park benches along paseos, church square steps at dusk, terrace rooftops with laundry drying. Emphasize concepts of calor humano (human warmth as emotional foundation), sobremesa (lingering at the table after a meal as bonding ritual), orgullo (pride balanced with vulnerability), and familia (family as the emotional safety net above all). The simple hand-drawn pencil sketch style echoes European sketchbook and cuaderno de campo tradition — an intimate organic aesthetic that resonates with Spanish audiences'' love for artisanal warmth, personal artistic expression, and Mediterranean visual storytelling. Props should include ceramic coffee cups with saucers, stone plaza benches, balcony railings with flower pots, hand fans, terracotta plant pots with geraniums, old wooden doors, woven shopping baskets, bread loaves on cutting boards. Spanish audiences express emotions openly — show psychology through warm social scenes: animated conversations with hand gestures, shared meals, balcony solitude at sunset, plaza gatherings. Vulnerability is not hidden but shared with trusted people. The Mediterranean light (golden, warm, casting long shadows) is a powerful emotional anchor.'
