audience_language: Portuguese
audience_culture_note: 'Design for Portuguese-speaking finance viewers aged 25-45 (Brazil/Portugal). Use settings from Lusophone financial life: family homes, local cafés, small businesses (padarias, lojas), banks, beach-side meetings, home offices. Emphasize concepts of poupança (saving), investimento, empreendedorismo (entrepreneurship), segurança familiar (family security), and sonhos realizados (dreams achieved). Props should include reais/euros, family photos, small business signs, café com leite, smartphones with banking apps, beach chairs (quality of life), football jerseys. Portuguese-speaking audiences value family warmth, entrepreneurial spirit, and enjoying life while building security. Show finance through relatable situations: starting small business, saving for casa própria, planning for children education, investing in family future, balancing work and beach life, building legacy.'
cultural_props: reais/euros, café com leite, family photo, small business sign, smartphone banking, beach chair, football jersey, house keys
cultural_metaphors: 'growth: árvore crescendo forte, jardim florescendo | risk: atravessar ponte estreita, tempestade chegando | security: casa forte, guarda-chuva protegendo | wealth: mesa farta, árvore de ouro, colheita abundante | debt: correntes pesadas, nuvens escuras | investment: plantar sementes para futuro, construir tijolo por tijolo | savings: cofrinho enchendo, gota a gota | opportunity: porta aberta com luz, nascer do sol | financial_freedom: pássaro livre, topo da montanha | family_security: lar acolhedor, crianças estudando'
cultural_emotion_style: 'Portuguese-speaking audiences value family warmth, entrepreneurial energy, and life enjoyment alongside financial responsibility. Show concepts through family and community: supporting loved ones, building family business, creating opportunities for children, enjoying life moments. Express financial stress through family concern (reuniões familiares, working hard for better life) but also hope and resilience. Financial success is shown through family achievements (casa própria, negócio próspero, filhos educados, férias na praia) and ability to enjoy life. Trust is built through personal stories, family values, and practical wisdom. Healing comes through family support, hard work, faith, and maintaining alegria de viver. The warm community context — família reunida, negócio de bairro, praia aos domingos — carries deep financial and emotional meaning.'
