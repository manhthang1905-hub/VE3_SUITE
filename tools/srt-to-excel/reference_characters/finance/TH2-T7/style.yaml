audience_language: Japanese
audience_culture_note: 'Design for Japanese finance viewers aged 25-45. Use settings from Japanese financial life: compact apartments, convenience stores, train stations, office spaces, traditional banks, minimalist home offices. Emphasize concepts of 貯金 (chokin/saving), 投資 (toushi/investment), 老後 (rougo/retirement planning), 節約 (setsuyaku/frugality), and 安定 (antei/stability). Props should include yen notes/coins, passbooks (通帳), smartphones with banking apps, train passes, convenience store receipts, minimalist notebooks, bento boxes. Japanese audiences value discipline, long-term planning, risk aversion, and systematic approach. Show finance through relatable situations: saving systematically, planning for retirement, buying small apartment, investing in NISA, maintaining financial discipline, preparing for uncertain future, balancing work and life in expensive Tokyo.'
cultural_props: yen notes/coins, passbook (通帳), smartphone banking, train pass, convenience store receipt, minimalist notebook, bento box, apartment keys
cultural_metaphors: 'growth: 桜の木 (sakura tree) growing strong, 盆栽 (bonsai) cultivated carefully | risk: 細い橋 (narrow bridge), 嵐 (storm) approaching | security: 城 (castle) walls, 傘 (umbrella) protecting | wealth: 満ちた米俵 (full rice bags), 金の木 (golden tree) | debt: 重い鎖 (heavy chains), 暗雲 (dark clouds) | investment: 種を植える (planting seeds), 石を積む (stacking stones) | savings: 貯金箱 (piggy bank) filling, 一滴ずつ (drop by drop) | opportunity: 開いた扉 (open door), 日の出 (sunrise) | financial_freedom: 自由な鳥 (free bird), 山頂 (mountain peak) | stability: 安定した家 (stable home), 家族の安心 (family security)'
cultural_emotion_style: 'Japanese audiences value discipline, planning, and long-term stability in finance. Show concepts through systematic approach: following savings plans religiously, researching investments thoroughly, maintaining detailed records, preparing for retirement early. Express financial stress through quiet concern (checking passbook repeatedly, calculating expenses precisely, worrying about future) not dramatic displays. Financial success is shown through stability achieved (apartment purchased, retirement fund secured, children education planned) and peace of mind from preparation. Trust is built through data, proven methods, institutional credibility, and systematic approach. Healing comes through discipline, planning, and achieving milestones. The organized Japanese context — train schedules, convenience, minimalism, precision — carries financial reliability and respect for systems.'
