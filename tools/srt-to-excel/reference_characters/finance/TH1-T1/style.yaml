audience_language: Vietnamese
audience_culture_note: 'Design for Vietnamese finance and investment viewers aged 25-45. Use settings from Vietnamese financial life: small home offices with laptops and coffee, modern bank branches with clean interiors, coffee shops where business meetings happen, apartment balconies overlooking city skyline, small family businesses (shop fronts, market stalls), motorbike commutes thinking about money, ATM machines and mobile banking on phones. Emphasize concepts of tiết kiệm (saving and frugality as virtue), làm giàu (wealth building through hard work), đầu tư thông minh (smart investment), an toàn tài chính (financial security for family), and khởi nghiệp (entrepreneurship). Props should include Vietnamese currency (đồng notes and coins), gold jewelry (traditional wealth storage), red envelopes (lì xì), family business signs, motorbikes (major purchase decision), apartment keys (home ownership dream), mobile banking apps on phones, small notebooks for tracking expenses, coffee cups at
  business meetings. Vietnamese audiences value family financial security, practical wealth building, and distrust of get-rich-quick schemes. Show finance through relatable situations: saving for children education, buying first motorbike, starting small business, sending money to family, investing in gold, planning for Tết expenses.'
cultural_props: tien dong, vang trang suc, li xi do, xe may, chia khoa nha, dien thoai banking app, so ghi chi tieu, coc ca phe, bien hieu cua hang nho
cultural_metaphors: 'growth: small plant growing from coins in soil, bamboo growing tall and strong | risk: walking on narrow bridge over water, storm clouds gathering | security: strong house foundation, locked safe box, umbrella in rain | wealth: rice bowl overflowing, gold bars stacked neatly, tree heavy with fruit | debt: heavy chains on ankles, dark clouds overhead | investment: planting seeds that grow into trees, building blocks stacking higher | savings: water drops filling jar slowly, piggy bank getting heavier | opportunity: door opening with light streaming through, sunrise over city | financial_freedom: bird flying free from cage, person standing on mountain peak | family_security: warm house with lights on, children studying at desk'
cultural_emotion_style: 'Vietnamese audiences value practical financial wisdom over flashy wealth displays. Show finance concepts through family-centered decisions: saving for children education, supporting elderly parents, building family business. Express financial stress through quiet worry (looking at bills alone at night, checking phone banking repeatedly), not dramatic panic. Financial success is shown through modest pride (new motorbike, small business opening, helping family) rather than luxury displays. Trust is built through showing real Vietnamese financial situations: Tết expenses, wedding costs, medical emergencies, education fees. Healing comes through practical steps: making budget, cutting expenses, finding extra income, building emergency fund. The tropical urban context — coffee shop meetings, motorbike commutes, small apartment planning — carries financial meaning.'
