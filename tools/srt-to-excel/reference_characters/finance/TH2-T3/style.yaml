audience_language: English
audience_culture_note: 'Design for English-speaking finance and investment viewers aged 25-45. Use settings from modern financial life: home offices with laptops and coffee, bank branches, coffee shops for business meetings, apartment balconies with city views, small businesses, commutes thinking about money, ATMs and mobile banking. Emphasize concepts of financial freedom, smart investing, budgeting, retirement planning, and entrepreneurship. Props should include dollars/currency, credit cards, laptops, smartphones with banking apps, coffee cups, notebooks for tracking, charts and graphs. English-speaking audiences value independence, financial literacy, and practical wealth building. Show finance through relatable situations: saving for retirement, buying first home, starting side business, paying off debt, building emergency fund, investing in stocks.'
cultural_props: dollar bills, credit cards, laptop, smartphone banking app, coffee cup, budget notebook, house keys, car keys, stock charts
cultural_metaphors: 'growth: plant growing from coins, ladder climbing upward | risk: tightrope walking, stormy seas | security: fortress walls, safety net, umbrella | wealth: overflowing treasure chest, golden eggs, fruit-bearing tree | debt: ball and chain, sinking ship | investment: seeds becoming trees, compound interest snowball | savings: piggy bank filling, water reservoir | opportunity: open door with light, mountain summit | financial_freedom: breaking chains, soaring eagle | retirement: peaceful beach, hammock between palm trees'
cultural_emotion_style: 'English-speaking audiences value independence and self-reliance in finance. Show concepts through individual empowerment: taking control of money, making smart choices, building wealth independently. Express financial stress through visible worry (checking accounts, calculating bills, sleepless nights) but also determination. Financial success is shown through achievement milestones (debt-free celebration, first investment, home purchase) and freedom (travel, choices, security). Trust is built through transparency, data, and practical steps. Healing comes through education, action plans, and measurable progress. The modern professional context — home office, coffee shop meetings, digital banking — carries financial meaning.'
