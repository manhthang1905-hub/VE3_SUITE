audience_language: Spanish
audience_culture_note: 'Design for Spanish-speaking finance viewers aged 25-45. Use settings from Hispanic financial life: family homes with dining tables, local markets, small family businesses (tiendas), coffee shops, bank branches, home offices. Emphasize concepts of familia (family financial security), ahorro (saving), emprendimiento (entrepreneurship), herencia (legacy building), and educación financiera. Props should include pesos/euros, family photos, small business signs, coffee cups, notebooks, mobile banking, remittance services. Spanish-speaking audiences value family-centered financial decisions, multigenerational wealth, and community trust. Show finance through relatable situations: supporting family, starting negocio familiar, saving for quinceañera/wedding, sending remesas, buying family home, educating children.'
cultural_props: pesos/euros, familia photos, negocio familiar sign, coffee cup, notebook, mobile banking app, remittance app, house keys, dining table, vespa/motorbike
cultural_metaphors: 'growth: árbol familiar growing strong, semilla becoming harvest | risk: cruzar puente estrecho, tormenta approaching | security: casa fuerte, paraguas protecting family | wealth: mesa abundante, árbol de oro, cosecha rica | debt: cadenas pesadas, nubes oscuras | investment: plantar para el futuro, construir ladrillo por ladrillo | savings: alcancía llenándose, gota a gota | opportunity: puerta abierta con luz, amanecer nuevo | financial_freedom: pájaro libre, cumbre de montaña | family_security: hogar cálido, niños estudiando'
cultural_emotion_style: 'Spanish-speaking audiences value family unity and collective financial wellbeing. Show concepts through family decisions: supporting parents, educating children, building family business, leaving legacy. Express financial stress through family worry (reuniones familiares discussing money, parents working hard for children) but also resilience and hope. Financial success is shown through family achievements (casa propia, negocio familiar próspero, hijos educados) and ability to help extended family. Trust is built through personal stories, family values, and practical wisdom passed down. Healing comes through family support, hard work, and faith in better future. The warm family context — mesa familiar, negocio de barrio, comunidad — carries deep financial meaning.'
