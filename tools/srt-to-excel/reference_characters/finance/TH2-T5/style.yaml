audience_language: German
audience_culture_note: 'Design for German-speaking finance viewers aged 25-45. Use settings from German financial life: efficient home offices, banks, cafés, modern apartments, small businesses (Mittelstand), organized spaces. Emphasize concepts of Sparsamkeit (thrift), Sicherheit (security), Altersvorsorge (retirement planning), solide Investitionen (solid investments), and Ordnung (order/organization). Props should include euros, organized folders, precise calculators, smartphones with banking apps, house keys, car keys (German engineering), insurance documents. German audiences value precision, security, long-term planning, and systematic approach. Show finance through relatable situations: systematic saving, buying Eigenheim (own home), planning Rente (retirement), investing in ETFs, building Vermögen (wealth) through discipline, maintaining financial Ordnung.'
cultural_props: euros, organized folder, calculator, smartphone banking, house keys, car keys, insurance papers, coffee mug, precise notebook
cultural_metaphors: 'growth: Baum wachsend systematisch, Garten gepflegt | risk: schmaler Pfad, Sturm kommend | security: festes Fundament, Schutzschild, Versicherung | wealth: volle Scheune, Goldbarren gestapelt, Obstbaum tragend | debt: schwere Ketten, dunkle Wolken | investment: Samen pflanzen für Zukunft, Stein auf Stein bauen | savings: Sparschwein füllend, Tropfen für Tropfen | opportunity: offene Tür mit Licht, Berggipfel | financial_freedom: Vogel frei fliegend, Gipfel erreicht | security: starkes Haus, Familie geschützt'
cultural_emotion_style: 'German audiences value precision, security, and systematic approach to finance. Show concepts through organized planning: creating detailed budgets, following systematic savings plans, researching investments thoroughly, maintaining financial order. Express financial stress through methodical concern (reviewing spreadsheets, checking insurance coverage, planning contingencies) not chaos. Financial success is shown through security achieved (Eigenheim purchased, Altersvorsorge secured, Vermögen built systematically) and peace of mind from good planning. Trust is built through data, precision, transparency, and proven systems. Healing comes through creating order, following plans, and achieving security milestones. The organized German context — efficient systems, precise planning, quality engineering — carries financial reliability.'
