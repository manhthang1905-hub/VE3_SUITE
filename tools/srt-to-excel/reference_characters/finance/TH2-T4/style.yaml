audience_language: French
audience_culture_note: 'Design for French-speaking finance viewers aged 25-45. Use settings from French financial life: elegant apartments, cafés for business meetings, banks, home offices, local markets, small boutiques. Emphasize concepts of épargne (saving), patrimoine (wealth building), retraite (retirement planning), investissement intelligent, and qualité de vie (quality of life). Props should include euros, café au lait, elegant notebooks, smartphones with banking apps, apartment keys, wine bottles (investment), art pieces. French audiences value work-life balance, cultural sophistication, and long-term wealth preservation. Show finance through relatable situations: saving for retirement, buying apartment in Paris, investing in wine/art, planning vacances, building patrimoine for children, enjoying quality of life while being financially responsible.'
cultural_props: euros, café au lait, elegant notebook, smartphone banking, apartment keys, wine bottle, art piece, baguette, bicycle
cultural_metaphors: 'growth: vignes growing into wine, jardin cultivé with care | risk: traverser la Manche, tempête en mer | security: château fort, parapluie élégant | wealth: cave à vin remplie, jardin abondant, patrimoine familial | debt: boulet aux pieds, nuages sombres | investment: planter pour récolter, bâtir pierre par pierre | savings: tirelire se remplissant, goutte à goutte | opportunity: porte ouverte lumineuse, lever du soleil | financial_freedom: oiseau libre, sommet de montagne | quality_life: terrasse ensoleillée, vélo le long de Seine'
cultural_emotion_style: 'French audiences value sophistication, quality of life, and long-term thinking in finance. Show concepts through balanced living: working smart not just hard, enjoying life while building wealth, investing in culture and experiences. Express financial stress through elegant restraint (quiet concern over café, reviewing documents with wine) not dramatic panic. Financial success is shown through quality of life (beautiful apartment, cultural experiences, time for family and friends, retirement security) not flashy displays. Trust is built through intellectual approach, historical perspective, and appreciation for finer things. Healing comes through balanced approach, cultural values, and long-term vision. The refined French context — café meetings, apartment living, cultural appreciation — carries financial sophistication.'
