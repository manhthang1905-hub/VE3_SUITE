audience_language: Turkish
audience_culture_note: 'Design for Turkish finance viewers aged 25-45. Use settings from Turkish financial life: apartments in Istanbul, çay bahçesi (tea gardens), local markets, small businesses (dükkan), banks, home offices, Bosphorus views. Emphasize concepts of tasarruf (saving), yatırım (investment), aile güvenliği (family security), girişimcilik (entrepreneurship), and istikrar (stability). Props should include Turkish lira, çay glasses, family photos, small business signs, apartment keys, gold jewelry (traditional savings), mobile banking. Turkish audiences value family bonds, entrepreneurial spirit, resilience, and building security through hard work. Show finance through relatable situations: saving for ev (home), starting own işletme (business), protecting family from enflasyon (inflation), investing in altın (gold), planning for children education, building wealth despite economic challenges, achieving financial independence.'
cultural_props: Turkish lira, çay glass, family photo, small business sign, apartment keys, gold jewelry, mobile banking, simit, evil eye bead
cultural_metaphors: 'growth: ağaç (tree) growing strong, bağ (vineyard) flourishing | risk: dar köprü (narrow bridge), fırtına (storm) coming | security: kale duvarları (fortress walls), şemsiye (umbrella) protecting | wealth: dolu sofra (full table), altın ağacı (golden tree), bereketli hasat (abundant harvest) | debt: ağır zincirler (heavy chains), kara bulutlar (dark clouds) | investment: tohum ekmek (planting seeds), taş üstüne taş (stone upon stone) | savings: kumbara (piggy bank) filling, damla damla (drop by drop) | opportunity: açık kapı (open door), gün doğumu (sunrise) | financial_freedom: özgür kuş (free bird), dağ zirvesi (mountain peak) | family_security: sıcak yuva (warm home), çocuklar okuyor (children studying)'
cultural_emotion_style: 'Turkish audiences value family unity, entrepreneurial resilience, and building security despite economic challenges. Show concepts through family and community: supporting parents, educating children, starting own business, protecting from inflation, building legacy. Express financial stress through family concern (aile toplantıları discussing money, working hard for better future) but also determination and hope. Financial success is shown through family achievements (ev sahibi olmak, kendi işini kurmak, çocukları okutmak) and ability to provide security. Trust is built through personal stories, family values, and practical wisdom from experience. Healing comes through family support, entrepreneurial spirit, faith, and resilience. The warm Turkish context — aile sofrası, mahalle, çay sohbeti — carries deep financial meaning rooted in community and family bonds.'
