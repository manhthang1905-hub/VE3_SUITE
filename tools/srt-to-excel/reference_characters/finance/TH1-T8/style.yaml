audience_language: Korean
audience_culture_note: 'Design for Korean finance viewers aged 25-45. Use settings from Korean financial life: compact apartments, cafés (카페), convenience stores, subway stations, office spaces, banks, PC rooms. Emphasize concepts of 저축 (jeochuk/saving), 투자 (tuja/investment), 노후준비 (nohu junbi/retirement planning), 재테크 (jaeteokeu/financial techniques), and 안정 (anjeong/stability). Props should include won notes/coins, smartphones with banking apps, subway cards, convenience store items, coffee cups, apartment keys, study materials. Korean audiences value education, hard work, systematic planning, and achieving financial goals through discipline. Show finance through relatable situations: saving for jeonse deposit, investing in stocks/crypto, planning for retirement, buying apartment, educating children, maintaining work-life balance in competitive Seoul, achieving financial independence.'
cultural_props: won notes/coins, smartphone banking, subway card, coffee cup, apartment keys, study materials, convenience store items, kimchi refrigerator
cultural_metaphors: 'growth: 나무 (tree) growing strong, 대나무 (bamboo) reaching high | risk: 좁은 다리 (narrow bridge), 폭풍 (storm) coming | security: 성벽 (fortress walls), 우산 (umbrella) protecting | wealth: 가득 찬 쌀독 (full rice container), 황금나무 (golden tree) | debt: 무거운 사슬 (heavy chains), 먹구름 (dark clouds) | investment: 씨앗 심기 (planting seeds), 돌 쌓기 (stacking stones) | savings: 저금통 (piggy bank) filling, 한 방울씩 (drop by drop) | opportunity: 열린 문 (open door), 일출 (sunrise) | financial_freedom: 자유로운 새 (free bird), 산 정상 (mountain peak) | stability: 튼튼한 집 (strong house), 가족의 안정 (family stability)'
cultural_emotion_style: 'Korean audiences value education, hard work, and systematic approach to achieving financial goals. Show concepts through disciplined planning: studying financial techniques (재테크), following savings plans strictly, researching investments thoroughly, preparing for competitive future. Express financial stress through intense concern (studying late at night, checking stock prices constantly, worrying about jeonse deposit) but also determination to succeed. Financial success is shown through milestones achieved (apartment purchased, children education secured, financial independence reached) and respect earned. Trust is built through education, proven methods, data, and systematic approach. Healing comes through learning, planning, achieving goals, and gaining stability. The competitive Korean context — café study sessions, subway commutes, apartment dreams, education focus — carries financial ambition and respect for hard work.'
