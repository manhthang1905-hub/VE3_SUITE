audience_language: Italian
audience_culture_note: 'Design for Italian finance viewers aged 25-45. Use settings from Italian financial life: family homes, piazzas, cafés (bar), small family businesses (negozi), banks, home offices, coastal towns. Emphasize concepts of risparmio (saving), investimento, famiglia (family security), eredità (legacy), and dolce vita (quality of life). Props should include euros, espresso cups, family photos, small business signs, Vespa scooters, apartment keys, wine bottles. Italian audiences value family bonds, quality of life, cultural richness, and building wealth while enjoying life. Show finance through relatable situations: supporting family, starting family business, buying casa, planning for children, investing in property, maintaining bella vita while being financially responsible, leaving legacy for next generation.'
cultural_props: euros, espresso cup, family photo, Vespa scooter, apartment keys, wine bottle, small business sign, pasta ingredients
cultural_metaphors: 'growth: albero (tree) growing strong, vite (vine) flourishing | risk: ponte stretto (narrow bridge), tempesta (storm) arriving | security: mura forti (strong walls), ombrello (umbrella) protecting | wealth: tavola abbondante (abundant table), albero d oro (golden tree), raccolto ricco (rich harvest) | debt: catene pesanti (heavy chains), nuvole scure (dark clouds) | investment: piantare semi (planting seeds), costruire pietra su pietra (building stone by stone) | savings: salvadanaio (piggy bank) filling, goccia a goccia (drop by drop) | opportunity: porta aperta (open door), alba (sunrise) | financial_freedom: uccello libero (free bird), cima della montagna (mountain peak) | family_security: casa calda (warm home), bambini che studiano (children studying)'
cultural_emotion_style: 'Italian audiences value family warmth, cultural richness, and enjoying life alongside financial responsibility. Show concepts through family and community: supporting loved ones, building family business, creating opportunities for children, enjoying cultural moments. Express financial stress through family concern (riunioni familiari, working for better life) but also resilience and passion for life. Financial success is shown through family achievements (casa propria, negozio di famiglia, figli educati, vacanze al mare) and ability to enjoy la dolce vita. Trust is built through personal relationships, family values, and cultural wisdom. Healing comes through family support, hard work, faith, and maintaining gioia di vivere. The warm Italian context — famiglia riunita, piazza del paese, pranzo domenicale — carries deep financial and emotional meaning rooted in centuries of family tradition.'
