# ── CHẾ ĐỘ API shopapi: BA SỐ QUYẾT ĐỊNH THÔNG LƯỢNG ─────────────────────────
#
# ⚠ TỪ BẢN 15/08/2026, HAI SỐ ẢNH/VIDEO DƯỚI ĐÂY CHỈ CÒN DÙNG KHI TẮT
# `shopapi_tu_dieu_tiet`. Bật (mặc định) thì trần KHÔNG còn gõ tay nữa.
#
# Vì sao bỏ: con số gõ tay sai theo cả hai chiều cùng một lúc. Đo 15/08/2026,
# `GET /v1/me` đang mời 979 chỗ ảnh và 374 chỗ video, trong khi tool giữ 40/16:
#
#     tám mã chạy  ->  8×40 = 320 trên 979, bỏ phí hai phần ba nhà máy
#     một mã chạy  ->  16 trên 374 chỗ video, bỏ phí 96%
#
# Bật tự điều tiết thì trần là phần giao của BA thứ, đo lại liên tục:
#
#   1. trần máy chủ đang cấp, CHIA cho số tiến trình mã đang sống thật
#      (đếm theo file nhịp sống, riêng từng loại job — nên lúc bảy mã làm ảnh
#      và một mã làm video thì mã video được trọn phần video);
#   2. suất luồng của máy này = `shopapi_ngan_sach_luong` ÷ số tiến trình,
#      và ngân sách đó TỰ HẠ khi máy thật sự không mở nổi luồng nữa;
#   3. trần theo SẢN LƯỢNG ĐO ĐƯỢC — đông hơn mà ra ít hơn thì lùi về mức tốt
#      nhất từng đo. Đây là lớp duy nhất nhìn thấy kiểu nghẽn "máy chủ nhận hết
#      rồi chạy chậm": 15/08/2026 nhà máy ảnh khai `capacity 1088` với đúng
#      MỘT thợ online, không 429, không 503, `queued = 0`.
shopapi_tu_dieu_tiet: true       # BẬT: trần ăn theo máy chủ + sản lượng đo được
shopapi_ma_song_song: 8          # số MÃ chạy cùng lúc
max_concurrent: 40               # trần ẢNH mỗi mã  (chỉ dùng khi tắt tự điều tiết)
shopapi_video_concurrency: 16    # trần VIDEO mỗi mã (nt)
music_workspace_mode_enabled: true
whisper_model: large-v3
whisper_language: auto
log_level: INFO

